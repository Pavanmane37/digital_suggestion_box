{% extends "base.html" %}
{% block title %}Thanks — The Suggestion Board{% endblock %}
{% block content %}

<section class="board board-center">
  <div class="note-card note-card-confirm">
    <span class="tape" aria-hidden="true"></span>
    <h2>It's on the board.</h2>
    <p>Thanks for taking the time to share this. It's been recorded and will be
      reviewed by the admin team.</p>
    <a class="btn-secondary" href="{{ url_for('index') }}">Submit another suggestion</a>
  </div>
</section>

{% endblock %}
